name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: line
    attributes:
      label: Example Markdown line
      description: The task line that misbehaves (remove private content).
      render: markdown
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0 (Settings → About)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Nothing Phone (3a) Lite, Android 15
    validations:
      required: true
  - type: dropdown
    id: sync
    attributes:
      label: How is the vault synced?
      options: [Obsidian Sync, Syncthing, Google Drive / Dropbox app, Git, Not synced, Other]
