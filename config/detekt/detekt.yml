# Builds on detekt's default config (buildUponDefaultConfig = true). Only deviations are listed.
naming:
  # Compose screens keep their Actions/UiState holders next to the screen.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview', 'ThemePreviews']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'ThemePreviews']
  WildcardImport:
    active: true
exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
